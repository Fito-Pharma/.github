<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Fito Pharma — Traditional Herbal Heritage Meets Modern Technology">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1611"/>
      <stop offset="55%" stop-color="#112017"/>
      <stop offset="100%" stop-color="#162A1E"/>
    </linearGradient>
    <linearGradient id="leaf-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="accent-gold-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F0CA50"/>
    </linearGradient>
    <pattern id="dots-dark" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#66BB6A" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="1278" height="318" rx="16" fill="url(#bg-dark)" stroke="#243E2D" stroke-width="1.5"/>

  <!-- Subtle Right-Side Dot Grid -->
  <rect x="740" y="20" width="520" height="280" rx="12" fill="url(#dots-dark)"/>

  <!-- Decorative Minimalist Concentric Arcs (Right) -->
  <g fill="none" stroke="#66BB6A" opacity="0.14">
    <circle cx="1130" cy="160" r="190" stroke-width="1.5"/>
    <circle cx="1130" cy="160" r="130" stroke-width="1.2" stroke-dasharray="6 6"/>
    <circle cx="1130" cy="160" r="70" stroke-width="1.2"/>
  </g>

  <!-- Right-Side Minimalist Tech-Botanical Node Graphic -->
  <g transform="translate(1055, 85)">
    <rect x="0" y="0" width="150" height="150" rx="28" fill="#13241A" stroke="#2B4B36" stroke-width="1.5"/>
    <!-- Stylized Herbal Leaf + Stem -->
    <path d="M75 30 C42 46, 36 86, 75 118 C114 86, 108 46, 75 30 Z" fill="url(#leaf-dark)"/>
    <path d="M75 40 L75 122" stroke="#0D1611" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M75 66 L58 55 M75 84 L92 72 M75 98 L60 88" stroke="#0D1611" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- Tech Nodes -->
    <circle cx="38" cy="40" r="4" fill="#E5C158"/>
    <circle cx="114" cy="112" r="4" fill="#66BB6A"/>
    <circle cx="116" cy="44" r="3" fill="#66BB6A" opacity="0.5"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="72" y="54" width="44" height="3.5" rx="2" fill="url(#accent-gold-dark)"/>

  <!-- Eyebrow -->
  <text x="128" y="60" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#81C784">
    VIETNAM · PHARMACEUTICAL &amp; TECHNOLOGY
  </text>

  <!-- Brand Name -->
  <text x="72" y="136" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1.2" fill="#F1F8F2">
    FITO PHARMA
  </text>

  <!-- Tagline -->
  <text x="72" y="178" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#A5C0AC">
    Traditional Herbal Heritage Meets Modern Technology
  </text>

  <!-- Pill Badges -->
  <g transform="translate(72, 218)" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="112" height="34" rx="17" fill="#172B1F" stroke="#2E513A" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#66BB6A"/>
    <text x="30" y="21.5" fill="#DCEEE0">GMP-WHO</text>

    <rect x="124" y="0" width="166" height="34" rx="17" fill="#172B1F" stroke="#2E513A" stroke-width="1.2"/>
    <circle cx="142" cy="17" r="4" fill="#E5C158"/>
    <text x="154" y="21.5" fill="#DCEEE0">EU / USDA Organic</text>

    <rect x="302" y="0" width="152" height="34" rx="17" fill="#172B1F" stroke="#2E513A" stroke-width="1.2"/>
    <circle cx="320" cy="17" r="4" fill="#64B5F6"/>
    <text x="332" y="21.5" fill="#DCEEE0">Digital &amp; AI</text>
  </g>
</svg>
